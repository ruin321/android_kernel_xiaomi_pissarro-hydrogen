name: Build Hydrogen Kernel (KSU)

on:
  workflow_dispatch:
  push:
    branches:
      - build/ksu-fix

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Restore AOSP clang cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchains/clang-r563880c
          key: aosp-clang-r563880c-v1

      - name: Download AOSP clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/toolchains"
          ok=0
          for ref in refs/tags/android-16.0.0_r4 refs/heads/android-16.0.0_r4 refs/heads/android16-release; do
            if curl -L --fail --retry 2 --retry-delay 3 \
                 -o /tmp/clang-r563880c.tar.gz \
                 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/$ref/clang-r563880c.tar.gz"; then
              mkdir -p "$HOME/toolchains/clang-r563880c"
              tar -xzf /tmp/clang-r563880c.tar.gz -C "$HOME/toolchains/clang-r563880c"
              ok=1
              break
            fi
          done
          if [ "$ok" != 1 ]; then
            rm -rf "$HOME/toolchains/.clang-src"
            git clone --depth=1 --filter=blob:none --sparse \
              --branch=android-16.0.0_r4 \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
              "$HOME/toolchains/.clang-src"
            git -C "$HOME/toolchains/.clang-src" sparse-checkout set clang-r563880c
            mkdir -p "$HOME/toolchains/clang-r563880c"
            cp -a "$HOME/toolchains/.clang-src/clang-r563880c/." "$HOME/toolchains/clang-r563880c/"
            rm -rf "$HOME/toolchains/.clang-src"
          fi
          "$HOME/toolchains/clang-r563880c/bin/clang" --version

  build:
    needs: toolchain
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init root solution submodules
        run: |
          git submodule update --init KernelSU KernelSU-Next ReSukiSU
          git -C KernelSU log -1 --oneline
          git -C KernelSU-Next log -1 --oneline
          git -C ReSukiSU log -1 --oneline

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git libelf-dev libssl-dev \
            perl python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Restore AOSP clang cache
        uses: actions/cache@v4
        with:
          path: ~/toolchains/clang-r563880c
          key: aosp-clang-r563880c-v1

      - name: Verify AOSP clang
        run: |
          test -x "$HOME/toolchains/clang-r563880c/bin/clang"
          "$HOME/toolchains/clang-r563880c/bin/clang" --version

      - name: Build KSU kernel
        run: |
          ./build.sh -v ksu

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: HydrogenKernel-ksu
          path: HydrogenKernel-*.zip
          if-no-files-found: error